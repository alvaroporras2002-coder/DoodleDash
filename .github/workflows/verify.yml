name: Verify DoodleOnline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build application
        id: build
        run: node scripts/check-ci.mjs build
      - name: ${{ steps.build.outputs.summary || 'Build result' }}
        if: always() && !cancelled()
        run: echo 'Build result recorded above'
      - name: Check video server types
        id: servertypes
        run: node scripts/check-ci.mjs check:video
      - name: ${{ steps.servertypes.outputs.summary || 'Server type result' }}
        if: always() && !cancelled()
        run: echo 'Server type result recorded above'
      - name: Test video admission
        id: servervideo
        run: node scripts/check-ci.mjs test:video
      - name: ${{ steps.servervideo.outputs.summary || 'Server test result' }}
        if: always() && !cancelled()
        run: echo 'Server test result recorded above'

      - name: Test drawing chain and downloads
        if: always() && success()
        id: drawing
        run: node scripts/test-ci.mjs 'practice completes'
      - name: ${{ steps.drawing.outputs.summary || 'Drawing flow result' }}
        if: always() && !cancelled()
        run: echo 'Drawing result recorded above'
      - name: Test guest access
        if: always() && !cancelled()
        run: npm test -- --grep 'Guest entry'
      - name: Test optional call and device consent
        if: always() && !cancelled()
        run: npm test -- --grep 'optional call'
      - name: Test mobile layout and instructions
        if: always() && !cancelled()
        run: npm test -- --grep 'small screen'
      - name: Test room clarity and replay
        if: always() && !cancelled()
        run: npm test -- --grep 'room clarity'
      - name: Test DoodleOnline identity and responsive layouts
        if: always() && !cancelled()
        id: brand
        run: node scripts/test-ci.mjs 'DoodleOnline'
      - name: ${{ steps.brand.outputs.summary || 'Brand result' }}
        if: always() && !cancelled()
        run: echo 'Brand result recorded above'
      - name: Test automatic drawing snapshots
        run: npm test -- --grep 'autosave captures'
      - name: Test studio usability and performance
        id: optimization
        run: node scripts/test-ci.mjs 'studio optimization'
      - name: ${{ steps.optimization.outputs.summary || 'Optimization result' }}
        if: always() && !cancelled()
        run: echo 'Optimization result recorded above'
      - name: Test configured room entry and lateral call layout
        id: entry
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-key
        run: node scripts/test-ci.mjs 'configured entry'
      - name: ${{ steps.entry.outputs.summary || 'Entry result' }}
        if: always() && !cancelled()
        run: echo 'Entry result recorded above'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: doodledash
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: doodledash
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611110001_game.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/game.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611110002_guest_access.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/guests.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611110003_video_access.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/video.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611110004_two_players.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/two_players.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611110005_english.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/english.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/two_players.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611110006_autosave.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/autosave.sql
